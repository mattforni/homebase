name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # globs must be passed here, not left to the action's default. The default
      # is a single-asterisk `*.{md,markdown}`, which matches only the repo root,
      # so this job linted exactly two files until 2026-08-11. CLI args win over
      # the `globs` key in .markdownlint-cli2.jsonc, so the two are kept in sync.
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: "**/*.{md,markdown}"

  # The node renderer the three runners mail their page through. It stays green
  # only once @atelic-action/ui is published and runners/email/package-lock.json
  # is committed beside it, since `npm ci` refuses to run without a lockfile.
  renderer:
    name: Runner email renderer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runners/email
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Node 20, the version the runner images ship and the version the bundle
      # targets, so the gate runs what production runs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Every fixture renders and has to match its frozen golden byte for byte,
      # html and text alike.
      - name: Test
        run: npm test

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # shellcheck ships on the ubuntu runner image. The script runs shellcheck
      # plus bash -n plus zsh -n, and is the same one .githooks/pre-commit calls.
      - name: Lint shell
        run: ./bin/lint/shell

      # The reconciler is the one part of setup.sh that can leave you without a
      # working shell, and it refuses to run from a worktree, so it cannot be
      # exercised for real before merging. This clones to a scratch path and
      # runs it against a throwaway $HOME.
      - name: Test home reconciliation
        run: ./bin/lint/reconcile-test

      # A scheduled runner's PATH is stated in two files that cannot read each
      # other, and a plist names its runner as a bare XML string. Both drift
      # silently and both surface at 06:00 on a morning nobody is watching,
      # which is how the Outreacher went a week without once reaching its agent.
      - name: Check runners
        run: ./bin/lint/runners

      # The two always loaded context files (CLAUDE.md, .claude/CLAUDE.md) each
      # carry a byte cap set at their last reduction. Growth past it fails here
      # and in the pre-commit hook, so a reduction stays reduced.
      - name: Check context size caps
        run: ./bin/lint/context-size
