name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # globs must be passed here, not left to the action's default. The default
      # is a single-asterisk `*.{md,markdown}`, which matches only the repo root,
      # so this job linted exactly two files until 2026-08-11. CLI args win over
      # the `globs` key in .markdownlint-cli2.jsonc, so the two are kept in sync.
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: "**/*.{md,markdown}"

  # The node renderer the runners mail their pages through. `npm ci` installs
  # exactly what runners/email/package-lock.json pins, @atelic-action/ui among
  # it, so a pin bumped without its lockfile fails here.
  renderer:
    name: Runner email renderer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runners/email
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Node 24, the version the runner images ship (node:24-slim) and the
      # version the bundle targets, so the gate runs what production runs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Every fixture renders and has to match its frozen golden byte for byte,
      # html and text alike. A bundle carries one runner's page, so there is
      # no single build to run first: the test builds each runner's bundle
      # the way that runner's image does, and renders through it.
      - name: Test
        run: npm test

      # The brief runner's pulls: the spend split, the calendar lint and the
      # shaping of each pull, on invented rows. They import the scripts beside
      # the entrypoint and need no package, so node alone runs them.
      - name: Test the brief runner's pulls
        run: node --test ../brief/tst/*.test.mjs

      # A runner that lives in another repository brings its page with it.
      # The Shell job runs this same file for the staging and stops short of
      # the bundle, since it has no packages; here they are installed, so the
      # page is built and rendered too.
      - name: Test a runner outside this repository, bundle included
        run: ../../bin/lint/runner-outside-test

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # shellcheck ships on the ubuntu runner image. The script runs shellcheck
      # plus bash -n plus zsh -n, and is the same one .githooks/pre-commit calls.
      - name: Lint shell
        run: ./bin/lint/shell

      # The reconciler is the one part of setup.sh that can leave you without a
      # working shell, and it refuses to run from a worktree, so it cannot be
      # exercised for real before merging. This clones to a scratch path and
      # runs it against a throwaway $HOME.
      - name: Test home reconciliation
        run: ./bin/lint/reconcile-test

      # A scheduled runner's PATH is stated in two files that cannot read each
      # other, and a plist names its runner as a bare XML string. Both drift
      # silently and both surface at 06:00 on a morning nobody is watching,
      # which is how one runner went a week without once reaching its agent.
      - name: Check runners
        run: ./bin/lint/runners

      # bin/runner/changed decides which runner images a merge to main
      # promotes (promote.yml). A path it misses leaves a scheduled job on an
      # old image beside a green run, so its table of paths and the runners
      # each must reach runs here against a throwaway repository.
      - name: Test the promote path rules
        run: ./bin/lint/runner-changed-test

      # A runner may live in another repository, which checks this one out
      # for its tooling and stages its own image with it. Nothing here ever
      # stages one for real, so a throwaway repository with an invented
      # runner does: what it brings, and every path a manifest is refused.
      - name: Test a runner outside this repository
        run: ./bin/lint/runner-outside-test

      # A run may land one file (a roster, say) on a main that moved while it
      # ran, and read a list a line at a time. Both failed
      # in silence for weeks: a rebase across a shallow clone, and xargs
      # stopping at an apostrophe. A throwaway bare repository that moves
      # between the clone and the push holds the first; a list with quotes
      # in it holds the second.
      - name: Test the file landing and the line reader
        run: ./bin/lint/runner-land-test

      # A promote takes its verdict from runner_build_wait, and the two ways
      # that can be wrong are both silent: a success reported for a build that
      # did not succeed, and a build left running with nobody to cancel it. A
      # fake gcloud replays each ending and the row holds the exit code and
      # whether a cancel was sent.
      - name: Test the build wait
        run: ./bin/lint/runner-build-test

      # The secrets gate hook denies any Bash command that would print a
      # credentials file into a transcript. A hook that fails open is one
      # regex edit from guarding nothing, so a table of commands that must
      # deny and must pass runs here and by hand.
      - name: Test the secrets gate
        run: ./bin/lint/secrets-gate-test

      # The voice gate hook denies a Gmail draft or send through gws until the
      # session has read the voice canon and the email overlay. Same reasoning
      # as the secrets gate: it fails open, so its table runs here.
      - name: Test the voice gate
        run: ./bin/lint/voice-gate-test

      # The worktree gate hook denies mutating git on a primary checkout,
      # typed or wrapped in a shell script the command runs. Its parsing is all
      # regex and it fails open, so a table over throwaway repos runs here.
      - name: Test the worktree gate
        run: ./bin/lint/worktree-gate-test

      # The always loaded context files listed in .context-caps each
      # carry a byte cap set at their last reduction. Growth past it fails here
      # and in the pre-commit hook, so a reduction stays reduced.
      - name: Check context size caps
        run: ./bin/lint/context-size

      # The review wrapper's normaliser turns each reviewer's raw output into
      # the stream the lander gates on. A shape that came out ran:true when
      # nothing was reviewed would fail open, so its table runs here.
      - name: Test the review normaliser
        run: ./bin/lint/review-normalise-test
